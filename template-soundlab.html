<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sea Of Crabs – äänilaboratorio</title>
<style>
  body { margin: 0; background: #1d2a2f; color: #fff6e4; font-family: Georgia, 'Times New Roman', serif; }
  .lab { max-width: 640px; margin: 0 auto; padding: 16px 14px 48px; display: flex; flex-direction: column; gap: 12px; }
  h1 { font-size: 22px; margin: 4px 0; }
  h2 { font-size: 16px; margin: 0 0 8px; letter-spacing: 0.5px; color: #f3d9a0; }
  .note { font-size: 14px; opacity: 0.8; margin: 0; line-height: 1.4; }
  .card { background: #2c3a40; border: 1px solid rgba(201, 180, 138, 0.5); border-radius: 14px; padding: 12px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  button { font: inherit; font-size: 15px; color: #fff6e4; background: #46565c; border: 1px solid rgba(255, 244, 214, 0.35); border-radius: 11px; padding: 11px 10px; text-align: left; cursor: pointer; }
  button:active { transform: scale(0.97); }
  button.active { background: #2f7f8f; border-color: #bfeaf2; }
  button.wide { width: 100%; text-align: center; font-weight: bold; background: #c98a2a; border-color: #ffe2a8; margin-bottom: 6px; }
  button.wide.active { background: #2f7f8f; }
  .row button { flex: 1; text-align: center; min-width: 30%; }
  .number { display: inline-block; min-width: 22px; margin-right: 6px; padding: 1px 5px; border-radius: 7px; background: rgba(0, 0, 0, 0.3); font-size: 12px; text-align: center; }
  .slider { display: flex; flex-direction: column; gap: 4px; font-size: 14px; margin: 6px 0; }
  input[type=range] { width: 100%; }
</style>
</head>
<body>

</body>
</html>
