<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#9ec7db">
<title>Sea Of Crabs</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9ec7db; overscroll-behavior: none; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; -webkit-user-select: none; user-select: none; }
  #perf { position: fixed; top: calc(max(6px, env(safe-area-inset-top)) + 76px); left: max(6px, env(safe-area-inset-left)); padding: 4px 7px;
    font: 11px/1.35 ui-monospace, Menlo, Consolas, monospace; color: #e8f4f8; background: rgba(8, 24, 34, 0.55); border-radius: 6px; white-space: pre; pointer-events: auto; }
  #perf.compact { max-height: 15px; overflow: hidden; }
  #hud { position: fixed; inset: 0; pointer-events: none; font-family: Georgia, 'Times New Roman', serif; color: #fff8e8; }
  #hud .compass { position: absolute; left: max(12px, env(safe-area-inset-left)); bottom: max(12px, env(safe-area-inset-bottom)); width: 86px; text-align: center; }
  #hud svg { width: 74px; height: 74px; filter: drop-shadow(0 1px 2px rgba(0,0,0,.45)); }
  #hud .dial { fill: rgba(20, 30, 36, 0.45); stroke: rgba(255, 248, 232, 0.8); stroke-width: 3; }
  #hud .wind-arrow path { fill: none; stroke: #fff8e8; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
  #hud .readout { display: inline-block; margin-top: 3px; padding: 1px 9px; border-radius: 10px; background: rgba(20, 30, 36, 0.55); font-size: 14px; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  #hud .speed { font-size: 20px; font-weight: bold; }
  #hud .status { position: absolute; top: 18%; left: 50%; transform: translateX(-50%); padding: 6px 14px; border-radius: 8px;
    background: rgba(60, 20, 10, 0.6); font-size: 18px; opacity: 0; transition: opacity .3s; }
  #hud .status.visible { opacity: 1; }
  #hud .hint { position: absolute; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(70vw, 520px);
    text-align: center; font-size: 15px; padding: 8px 12px; border-radius: 8px; background: rgba(20, 30, 36, 0.5); transition: opacity .6s; }
  #hud .hint span { white-space: nowrap; }
  #hud .hint.hidden { opacity: 0; }
  @media (max-aspect-ratio: 1/1) { #hud .hint { bottom: calc(max(12px, env(safe-area-inset-bottom)) + 120px); width: 80vw; } }
  #hud .inventory { position: absolute; top: max(8px, env(safe-area-inset-top)); right: max(8px, env(safe-area-inset-right)); display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; max-width: 60vw; }
  #hud .slot { padding: 4px 9px; border-radius: 12px; background: rgba(20, 30, 36, 0.6); font-size: 15px; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  #hud button { pointer-events: auto; font-family: inherit; color: #fff8e8; border: 1.5px solid rgba(255, 248, 232, 0.7); cursor: pointer; }
  #hud .reset { position: absolute; top: calc(max(8px, env(safe-area-inset-top)) + 136px); right: max(8px, env(safe-area-inset-right)); padding: 3px 10px; border-radius: 12px; background: rgba(20, 30, 36, 0.45); font-size: 14px; }
  #hud .reset.armed { background: rgba(120, 30, 20, 0.8); }
  #hud .toast { position: absolute; top: 14%; left: 50%; transform: translate(-50%, -6px); padding: 7px 16px; border-radius: 10px; background: rgba(20, 30, 36, 0.7); font-size: 18px; opacity: 0; transition: opacity .25s, transform .25s; }
  #hud .toast.visible { opacity: 1; transform: translate(-50%, 0); }
  #hud .action { position: absolute; right: max(14px, env(safe-area-inset-right)); bottom: calc(max(14px, env(safe-area-inset-bottom)) + 52px); padding: 12px 20px; border-radius: 26px; background: rgba(150, 90, 30, 0.88); font-size: 18px; font-weight: bold; box-shadow: 0 2px 8px rgba(0,0,0,.4); display: none; }
  #hud .action.visible { display: block; }
  #hud .action small { display: block; font-size: 13px; font-weight: normal; margin-top: 2px; }
  #hud .action.disabled { background: rgba(70, 60, 50, 0.85); color: #d8d0c0; border-color: rgba(216, 208, 192, 0.5); }
  #hud .quest-chip { position: absolute; top: max(8px, env(safe-area-inset-top)); left: max(8px, env(safe-area-inset-left)); max-width: 55vw; padding: 5px 12px; border-radius: 12px; background: rgba(60, 35, 15, 0.78); font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; }
  #hud .bag-chip { position: absolute; top: calc(max(8px, env(safe-area-inset-top)) + 38px); left: calc(max(8px, env(safe-area-inset-left)) + 92px); padding: 5px 12px; border-radius: 12px; background: rgba(60, 35, 15, 0.78); font-size: 15px; }
  #hud .bag-chip.shifted { left: max(8px, env(safe-area-inset-left)); }
  #hud .tide-chip { position: absolute; top: calc(max(8px, env(safe-area-inset-top)) + 70px); right: max(8px, env(safe-area-inset-right)); padding: 4px 9px; border-radius: 12px; background: rgba(15, 50, 70, 0.65); font-size: 14px; font-variant-numeric: tabular-nums; }
  #hud .navy-chip { position: absolute; top: calc(max(8px, env(safe-area-inset-top)) + 102px); right: max(8px, env(safe-area-inset-right)); padding: 4px 9px; border-radius: 12px; background: rgba(110, 20, 15, 0.75); font-size: 14px; font-variant-numeric: tabular-nums; }
  #hud .hunger-chip { position: absolute; top: calc(max(8px, env(safe-area-inset-top)) + 38px); right: max(8px, env(safe-area-inset-right)); display: flex; align-items: center; gap: 5px; padding: 4px 9px; border-radius: 12px; background: rgba(20, 30, 36, 0.6); font-size: 14px; }
  #hud .hunger-bar { width: 60px; height: 8px; border-radius: 4px; background: rgba(0, 0, 0, 0.45); overflow: hidden; }
  #hud .hunger-fill { height: 100%; width: 100%; }
  #hud .hunger-row { display: flex; align-items: center; gap: 8px; font-size: 15px; margin-bottom: 6px; }
  #hud .hunger-row .hunger-bar { flex: 1; height: 10px; }
  #hud .bag-section { font-weight: bold; font-size: 14px; margin: 10px 0 4px; opacity: 0.75; }
  #hud .bag-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
  #hud .bag-slot { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 8px; background: rgba(120, 80, 40, 0.14); font-size: 15px; }
  #hud .bag-icon { font-size: 22px; }
  #hud .bag-name { flex: 1; }
  #hud .bag-count { font-weight: bold; }
  #hud .bag-slot button { padding: 4px 10px; border-radius: 12px; background: #9a5a1e; color: #fff8e8; border: none; font-size: 14px; }
  #hud .craft-chip { position: absolute; top: calc(max(8px, env(safe-area-inset-top)) + 38px); left: max(8px, env(safe-area-inset-left)); padding: 5px 12px; border-radius: 12px; background: rgba(60, 35, 15, 0.78); font-size: 15px; }
  #hud .recipe { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid rgba(90, 60, 30, 0.3); }
  #hud .recipe .owned { font-weight: normal; font-size: 14px; }
  #hud .recipe button { padding: 8px 16px; border-radius: 18px; background: #9a5a1e; color: #fff8e8; font-size: 16px; font-weight: bold; border: none; }
  #hud .recipe button:disabled { background: #d8ccb2; color: #6a5a44; }
  #hud .quest-log { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.45); display: none; align-items: center; justify-content: center; pointer-events: auto; z-index: 10; }
  #hud .quest-log.open { display: flex; }
  #hud .quest-panel { width: min(88vw, 460px); max-height: 80vh; overflow-y: auto; padding: 12px 16px 16px; border-radius: 14px; background: #f1e4c4; color: #3a2614; border: 3px solid #7a5230; box-shadow: 0 6px 24px rgba(0,0,0,.5); }
  #hud .quest-header { display: flex; justify-content: space-between; align-items: center; font-size: 20px; font-weight: bold; margin-bottom: 8px; }
  #hud .quest-close { background: none; color: #3a2614; border: none; font-size: 22px; padding: 0 4px; }
  #hud .quest { padding: 8px 0; border-top: 1px solid rgba(90, 60, 30, 0.3); }
  #hud .quest-title { font-size: 17px; font-weight: bold; }
  #hud .quest.done { opacity: 0.55; }
  #hud .quest-description { font-size: 14px; margin: 3px 0 6px; }
  #hud .quest-step { display: flex; justify-content: space-between; font-size: 15px; padding: 2px 0; }
  #hud .quest-step.done { color: #3d7a1c; text-decoration: line-through; }
  #hud .guide-arrow { position: absolute; left: 0; top: 0; width: 48px; height: 48px; border-radius: 50%; background: #f2a030; border: 3px solid #fff4dc; box-shadow: 0 2px 8px rgba(0,0,0,.5); display: none; }
  #hud .guide-arrow .distance { position: absolute; left: 50%; top: 52px; transform: translateX(-50%); font-size: 13px; font-weight: bold; white-space: nowrap; text-shadow: 0 1px 3px #000; }
  #hud .guide-arrow .icon { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 22px; }
  #hud .guide-arrow .chevron { position: absolute; inset: -22px; display: flex; align-items: center; justify-content: flex-end; font-size: 26px; color: #f2a030; -webkit-text-stroke: 1.5px #3a2008; }
  #hud .guide-arrow.sloop { background: rgba(40, 22, 8, 0.85); border-color: #f4ecd8; }
  #hud .guide-arrow.visible { display: block; }
  #fatal { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; font: 16px system-ui; color: #fff; background: #1d3440; text-align: center; }
</style>
</head>
<body>
<script>
  window.addEventListener('error', function (event) {
    var box = document.getElementById('fatal') || document.body.appendChild(Object.assign(document.createElement('div'), { id: 'fatal' }));
    box.textContent = 'Error: ' + (event.message || event.error);
  });
</script>
<script type="module">/*BUNDLE*/</script>
</body>
</html>
